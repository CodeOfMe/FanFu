[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fanfu"
dynamic = ["version"]
description = "Bidirectional converter between GGUF and HuggingFace formats with weight verification"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "FanFu Contributors" },
]
keywords = ["gguf", "huggingface", "safetensors", "converter", "llm", "model", "llama.cpp", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
    "gguf>=0.10",
    "safetensors>=0.4",
    "torch>=2.0",
    "transformers>=4.40",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
]

[project.scripts]
fanfu = "fanfu.cli:main"

[project.urls]
Homepage = "https://github.com/CodeOfMe/FanFu"
Repository = "https://github.com/CodeOfMe/FanFu"
Issues = "https://github.com/CodeOfMe/FanFu/issues"

[tool.setuptools.dynamic]
version = { attr = "fanfu.__version__" }

[tool.setuptools.packages.find]
include = ["fanfu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
